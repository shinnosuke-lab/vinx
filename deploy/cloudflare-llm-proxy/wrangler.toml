name = "vinx-llm-proxy"
main = "worker.js"
compatibility_date = "2026-04-07"

# Config that is not secret lives here; the API key does NOT (see README —
# it is set with `wrangler secret put DEEPSEEK_KEY`).
[vars]
# Which browser origins may use this endpoint. Comma-separated, no trailing
# slash; "*" allows any (only sensible while testing). The published site:
ALLOWED_ORIGINS = "https://shinnosuke-lab.github.io"
# The model(s) the proxy will accept; anything else is rewritten to the first.
# deepseek-v4-flash is DeepSeek's cheapest current model and a stable alias for
# the latest Flash build.
MODELS = "deepseek-v4-flash"
# Hard clamp on a single request's max_tokens, and on the request body size.
MAX_TOKENS = "4096"
MAX_BODY_BYTES = "1048576"

# Rate limits — SWITCHED OFF for now. With all three blocks commented out the
# Worker has no RL_* bindings and skips the checks (worker.js tests for the
# binding before calling it); the DeepSeek balance is the only ceiling.
#
# Why off: an agent turn is not one request. Every tool call the model makes
# (run_shell, read a file...) is a fresh chat completion, and a quick tool
# answers in a second, so a single visitor legitimately fires 10-20 requests
# in a row. The first numbers here (6 per 10 s, 30 per 60 s, per IP) cut
# those turns off mid-way, and the engine does not retry a 429 — the whole
# turn fails. Until the balance is worth more than the annoyance, no limits.
#
# To switch back on: uncomment, deploy. period must be 10 or 60 (platform);
# counting is per Cloudflare server, approximate (see README). Numbers that
# leave an agent turn alone while still catching a runaway loop or a flood:
# RL_BURST 30/10, RL_SUSTAINED 150/60, RL_GLOBAL 900/60.
#
#   RL_BURST     — short spike guard, per IP
#   RL_SUSTAINED — steady rate, per IP
#   RL_GLOBAL    — a coarse ceiling across everyone, so one location cannot run
#                  away even if many IPs each stay under their own limit
#
# [[ratelimits]]
# name = "RL_BURST"
# namespace_id = "2001"
#   [ratelimits.simple]
#   limit = 30
#   period = 10
#
# [[ratelimits]]
# name = "RL_SUSTAINED"
# namespace_id = "2002"
#   [ratelimits.simple]
#   limit = 150
#   period = 60
#
# [[ratelimits]]
# name = "RL_GLOBAL"
# namespace_id = "2003"
#   [ratelimits.simple]
#   limit = 900
#   period = 60
